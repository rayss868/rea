name: Sync fork with upstream

# Keeps this fork up to date with morluto/rea: merges upstream/main into
# main, so upstream changes arrive and this fork-only workflow survives.
# Runs daily, and on demand from the Actions tab ("Run workflow").
on:
  schedule:
    # 03:17 UTC daily - off the hour, when GitHub's scheduler is less busy
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: morluto/rea

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream/main into this fork
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
          cd work
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet --prune upstream '+refs/heads/*:refs/remotes/upstream/*'

          before=$(git rev-parse HEAD)
          upstream=$(git rev-parse refs/remotes/upstream/main)
          echo "fork main : ${before}"
          echo "upstream  : ${upstream}"

          if git merge-base --is-ancestor "${upstream}" HEAD; then
            echo "already up to date - nothing to do"
            exit 0
          fi

          # [skip ci] stops upstream's own CI workflows from firing on this
          # mirror push (they fail here: a fork has no secrets/runners).
          git -c user.name="fork-sync[bot]" \
              -c user.email="fork-sync@users.noreply.github.com" \
              merge --no-edit -m "chore: sync with upstream ${upstream} [skip ci]" "${upstream}"

          # The default GITHUB_TOKEN is an App token without the `workflows`
          # permission, so it may not create OR update files under
          # .github/workflows/ - and upstream edits its CI files often. Keep
          # the fork's own copies (this workflow included) and drop any file
          # upstream added there; everything else syncs normally.
          git checkout "${before}" -- .github/workflows 2>/dev/null || true
          git clean -fdq .github/workflows 2>/dev/null || true
          git add -A .github/workflows
          if ! git diff --cached --quiet; then
            git commit --quiet --amend --no-edit
            echo "kept the fork's own .github/workflows (App token may not push CI changes)"
          fi

          after=$(git rev-parse HEAD)
          echo "merged ${before} + ${upstream} -> ${after}"
          git push --quiet origin main
          echo "sync complete"
